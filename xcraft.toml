base_image = "ghcr.io/almalinux/10-base:10.2@sha256:ed618ca107e9fd47ee2a64d1d33119ef356cfaf65a338daaa3fad19b80ae5da4"
platforms = ["linux/amd64/v2", "linux/arm64"]
# AlmaLinux rebuilds EPEL for x86_64_v2: the locks of the architectures have the same versions but for it
release_suffixes = [".alma_altarch"]
packages = [
    # like mock's build roots, and what XCP-ng specs expect without BuildRequires
    # (coreutils-single, in the base image, provides coreutils)
    "bash", "bzip2", "cpio", "diffutils", "findutils", "gawk", "grep", "gzip", "patch", "sed",
    "tar", "unzip", "which", "xz",
    "rpm-build", "redhat-rpm-config", "epel-rpm-macros", "gcc", "gcc-c++", "make", "git",
]
# the packages of the same archive, which xcraft bump --version updates together
same_version = [["kernel", "kernel-headers"]]
ccache_size = { kernel = "20G" }

[macros]
dist = "%{?autorev}.xcpng8.99"
xcpng = "9"
xenserver = "9"

# the current AlmaLinux 10 and its EPEL: the lock decides of the versions used
[repos.baseos]
baseurl = "https://repo.almalinux.org/almalinux/10/BaseOS/{arch}/os/"
gpgkey = "file:///etc/pki/rpm-gpg/RPM-GPG-KEY-AlmaLinux-10"
source_baseurl = "https://vault.almalinux.org/10/BaseOS/Source/"

[repos.appstream]
baseurl = "https://repo.almalinux.org/almalinux/10/AppStream/{arch}/os/"
gpgkey = "file:///etc/pki/rpm-gpg/RPM-GPG-KEY-AlmaLinux-10"
source_baseurl = "https://vault.almalinux.org/10/AppStream/Source/"

[repos.crb]
baseurl = "https://repo.almalinux.org/almalinux/10/CRB/{arch}/os/"
gpgkey = "file:///etc/pki/rpm-gpg/RPM-GPG-KEY-AlmaLinux-10"
source_baseurl = "https://vault.almalinux.org/10/CRB/Source/"

[repos.extras]
baseurl = "https://repo.almalinux.org/almalinux/10/extras/{arch}/os/"
gpgkey = "file:///etc/pki/rpm-gpg/RPM-GPG-KEY-AlmaLinux-10"
source_baseurl = "https://vault.almalinux.org/10/extras/Source/"

[repos.devel]
baseurl = "https://repo.almalinux.org/almalinux/10/devel/{arch}/os/"
gpgkey = "file:///etc/pki/rpm-gpg/RPM-GPG-KEY-AlmaLinux-10"
source_baseurl = "https://vault.almalinux.org/10/devel/Source/"

# AlmaLinux rebuilds EPEL for x86_64_v2 only
[repos.epel]
baseurl = "https://epel.repo.almalinux.org/10/{arch}/"
gpgkey = "https://repo.almalinux.org/almalinux/RPM-GPG-KEY-AlmaLinux-10-EPEL-AltArch"
source_baseurl = "https://epel.vault.almalinux.org/10/Source/"
arches = ["x86_64_v2"]

[repos.epel-fedora]
baseurl = "https://dl.fedoraproject.org/pub/epel/10/Everything/{arch}/"
gpgkey = "https://dl.fedoraproject.org/pub/epel/RPM-GPG-KEY-EPEL-10"
source_baseurl = "https://dl.fedoraproject.org/pub/epel/10/Everything/source/tree/"
arches = ["x86_64", "aarch64"]

# what xcraft import imports: the branches of xcp-ng-rpms, and XenServer's source RPMs, on XS-9.0
[import]
branches = ["master", "XS-9.0"]
srpm_branch = "XS-9.0"
removed = ["Citrix_Logo_Black.png", "COPYING.CitrixCommercial"]

# the test storage, Garage on a Hetzner server, behind Caddy, over HTTPS: the S3 writes, signed, and the public reads
# share its port; the S3 credentials are those of its key xcraft-ci
[remote]
url = "https://91.98.220.14"
s3_endpoint = "https://91.98.220.14"
bucket = "xcraft"
region = "garage"

[publish]
release = "9.0"

[iso]
installer = [
    # the mandatory packages of AlmaLinux's @core, but kexec-tools, xfsprogs and yum
    "audit", "basesystem", "bash", "coreutils", "cronie", "cronie-noanacron", "curl", "dnf", "e2fsprogs",
    "filesystem", "firewalld", "glibc", "grubby", "hostname", "iproute", "iproute-tc", "iputils",
    "irqbalance", "kbd", "less", "logrotate", "man-db", "ncurses", "openssh-clients", "openssh-server",
    "p11-kit", "parted", "policycoreutils", "procps-ng", "rootfiles", "rpm", "rpm-plugin-audit",
    "selinux-policy-targeted", "setup", "shadow-utils", "sssd-common", "sssd-kcm", "sudo", "systemd",
    "util-linux", "vim-minimal",
    # the installer, xl for its preinit, and the hardware support
    "host-installer-startup", "chrony", "dhcp-client", "xen-dom0-tools", "kernel", "linux-firmware",
    # for debugging
    "netcat", "pciutils", "usbutils",
]
packages = ["xcp-ng-deps"]
