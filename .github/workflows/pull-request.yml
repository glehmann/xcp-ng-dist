name: Pull request

# the pull requests: their packages built, the packages they change, and those built against them, as development
# builds numbered by the run; those of the branches of the repository published in a stage of the dev bucket of their
# own, pr<number>, signed by the PR key, for the testers, and removed once closed, see pull-request-closed.yml; those of
# forks have no secrets, and publish nothing. The jobs always run, to show no skipped checks: the steps a pull request
# does not need are skipped instead.
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions: {}

env:
  FORCE_COLOR: "1"
  STAGE: pr${{ github.event.number }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64_v2
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    name: build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    permissions:
      # the runs of the pull request, which number its builds
      actions: read
      # the comment telling where the stage is
      pull-requests: write
    # the latest push of the pull request only
    concurrency:
      group: pull-request-${{ github.event.number }}-${{ matrix.arch }}
      cancel-in-progress: true
    env:
      XCRAFT_ARCH: ${{ matrix.arch }}
      PUBLISH: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
      # the development builds of the pull request, upgrading those of its previous runs: numbered by them, see below
      XCRAFT_DEV: pr${{ github.event.number }}
      # the key signing its development builds and its stage, trusted by nobody but its testers; for a fork, a key of
      # the runner made for them
      XCRAFT_KEY: ${{ github.event.pull_request.head.repo.full_name == github.repository && vars.PR_SIGNING_KEY_FINGERPRINT || '' }}
    steps:
      # its build number: how many runs of this workflow it had, up to this one, those cancelled by a later push
      # included, which only grows, as $XCRAFT_DEV_COUNTER, for the development builds to upgrade those of the previous
      # runs, rather than the number of the run, of all the pull requests
      - name: Number the build
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          # those of an earlier pull request of the same branch are older
          CREATED: ${{ github.event.pull_request.created_at }}
        run: |
          runs="repos/$GITHUB_REPOSITORY/actions/workflows/pull-request.yml/runs?event=pull_request&per_page=100"
          select=".workflow_runs | map(select(.run_number <= $GITHUB_RUN_NUMBER and .created_at >= \"$CREATED\"
            and .head_repository.full_name == \"$HEAD_REPO\")) | length"
          n=$(gh api --paginate --method GET "$runs" -f branch="$HEAD_REF" --jq "$select" | awk '{ n += $1 } END { print n }')
          [ "$n" -gt 0 ]
          printf 'XCRAFT_DEV_COUNTER=%s\n' "$n" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          # the merge with master and master, which the build IDs of the main branch are checked against
          fetch-depth: 2
      # the master the merge commit was made from, its first parent, as the main branch xcraft looks for, which the
      # checkout of a pull request does not have: without it, all the builds would be final ones
      - run: git update-ref refs/remotes/origin/master HEAD^1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "0.10.x"
          activate-environment: true
      - run: uv sync --locked
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            .xcraft/cache/specs
            .xcraft/cache/resolved
            .xcraft/cache/base
          key: xcraft-metadata-${{ matrix.arch }}-${{ github.run_id }}
          restore-keys: xcraft-metadata-${{ matrix.arch }}-
      - run: |
          if ! command -v podman || ! command -v gpg; then
            sudo apt-get update -q
            sudo apt-get install -qy podman gnupg
          fi
      - name: Set up signing
        if: env.PUBLISH == 'true'
        env:
          PR_SIGNING_PRIVATE_KEY: ${{ secrets.PR_SIGNING_PRIVATE_KEY }}
        run: |
          export GNUPGHOME="$RUNNER_TEMP/xcraft-gnupg"
          printf 'GNUPGHOME=%s\n' "$GNUPGHOME" >> "$GITHUB_ENV"
          install -d -m 700 "$GNUPGHOME"
          printf '%s' "$PR_SIGNING_PRIVATE_KEY" | gpg --batch --import
          gpg --batch --list-secret-keys "$XCRAFT_KEY"
      # master's builds are fetched from the main bucket, the compiler caches too, never pushed
      - run: xcraft build --locked --fetch=needed
        continue-on-error: ${{ matrix.arch == 'aarch64' }}
      # x86_64 alone, like incoming while aarch64 is not built: a publication replaces all the architectures of the stage
      - name: Publish the stage
        if: env.PUBLISH == 'true' && matrix.arch == 'x86_64_v2'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.DEV_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.DEV_AWS_SECRET_ACCESS_KEY }}
        run: |
          xcraft publish --locked --to dev --stage "$STAGE" --dev "$XCRAFT_DEV" --arch "$XCRAFT_ARCH" \
            --summary "$RUNNER_TEMP/stage.md"
      # what the pull request changes in the packages of the snapshot, compared with master, without building: for the
      # comment, which goes without it if it fails
      - name: Compare the packages with master
        if: env.PUBLISH == 'true' && matrix.arch == 'x86_64_v2'
        continue-on-error: true
        run: xcraft contents --diff HEAD^1 --markdown > "$RUNNER_TEMP/contents.md"
      # where the snapshot of the stage is, how to use it, its development builds, and what changes in its packages, in
      # the summary of the run, and in a comment of the pull request by architecture, the same one updated by each run
      - name: Tell where the stage is
        if: env.PUBLISH == 'true' && matrix.arch == 'x86_64_v2'
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.number }}
        run: |
          marker="<!-- xcraft stage $XCRAFT_ARCH -->"
          body="$(
            printf '%s\n### %s build %s succeeded\n\n' "$marker" "$XCRAFT_ARCH" "$XCRAFT_DEV_COUNTER"
            cat "$RUNNER_TEMP/stage.md"
            if [ -s "$RUNNER_TEMP/contents.md" ]; then
              printf '\n#### The packages, compared with master\n\n'
              cat "$RUNNER_TEMP/contents.md"
            fi
          )"
          printf '%s\n' "$body" >> "$GITHUB_STEP_SUMMARY"
          comments="repos/$GITHUB_REPOSITORY/issues/$NUMBER/comments"
          id=$(gh api --paginate "$comments" --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -n 1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" > /dev/null
          else
            gh api -X POST "$comments" -f body="$body" > /dev/null
          fi
      - name: Clean up signing
        if: always()
        run: |
          export GNUPGHOME="$RUNNER_TEMP/xcraft-gnupg"
          if [ -d "$GNUPGHOME" ]; then
            gpgconf --kill gpg-agent || true
            rm -rf "$GNUPGHOME"
          fi
