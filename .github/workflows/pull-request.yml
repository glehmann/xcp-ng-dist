name: Pull request

# the pull requests: their packages built, the packages they change, and those built against them, as development
# builds numbered by the run, natively on each architecture; those of the branches of the repository published in a
# stage of the dev bucket of their own, pr<number>, all the architectures in one snapshot, signed by the PR key, for
# the testers, and removed once closed, see pull-request-closed.yml; those of forks have no secrets, and publish
# nothing. The jobs always run, to show no skipped checks: the steps a pull request does not need are skipped instead.
# In the private repository of the embargoes, XCRAFT_ROLE private, those of its embargo branches only, numbered
# against them, fetching their builds from the private bucket, and published nowhere: tested with xcraft repo --host.
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions: {}

env:
  FORCE_COLOR: "1"
  STAGE: pr${{ github.event.number }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64_v2
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    name: build (${{ matrix.arch }})
    if: vars.XCRAFT_ROLE == 'public' || (vars.XCRAFT_ROLE == 'private' && startsWith(github.base_ref, 'embargo/'))
    runs-on: ${{ matrix.runner }}
    permissions:
      # the runs of the pull request, which number its builds
      actions: read
    # the latest push of the pull request only
    concurrency:
      group: pull-request-${{ github.event.number }}-${{ matrix.arch }}
      cancel-in-progress: true
    env:
      XCRAFT_ARCH: ${{ matrix.arch }}
      PUBLISH: ${{ vars.XCRAFT_ROLE == 'public' && github.event.pull_request.head.repo.full_name == github.repository }}
      # the development builds of the pull request, upgrading those of its previous runs: numbered by them, see below
      XCRAFT_DEV: pr${{ github.event.number }}
      # the key signing its development builds and its stage, trusted by nobody but its testers; for a fork, a key of
      # the runner made for them
      XCRAFT_KEY: ${{ github.event.pull_request.head.repo.full_name == github.repository && vars.PR_SIGNING_KEY_FINGERPRINT || '' }}
    steps:
      # its build number: how many runs of this workflow it had, up to this one, those cancelled by a later push
      # included, which only grows, as $XCRAFT_DEV_COUNTER, for the development builds to upgrade those of the previous
      # runs, rather than the number of the run, of all the pull requests; the same in all the jobs of the run, which
      # the keys of the development builds and of their ISOs have, for the publication to find them
      - &number
        name: Number the build
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          # those of an earlier pull request of the same branch are older
          CREATED: ${{ github.event.pull_request.created_at }}
        run: |
          runs="repos/$GITHUB_REPOSITORY/actions/workflows/pull-request.yml/runs?event=pull_request&per_page=100"
          select=".workflow_runs | map(select(.run_number <= $GITHUB_RUN_NUMBER and .created_at >= \"$CREATED\"
            and .head_repository.full_name == \"$HEAD_REPO\")) | length"
          n=$(gh api --paginate --method GET "$runs" -f branch="$HEAD_REF" --jq "$select" | awk '{ n += $1 } END { print n }')
          [ "$n" -gt 0 ]
          printf 'XCRAFT_DEV_COUNTER=%s\n' "$n" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          # the merge with master and master, which the build IDs of the main branch are checked against; all of them
          # for a maintenance branch, whose commits are told from master's by their first-parent chains
          fetch-depth: ${{ github.base_ref == 'master' && 2 || 0 }}
      # the master the merge commit was made from, its first parent, as the main branch xcraft looks for, which the
      # checkout of a pull request does not have: without it, all the builds would be final ones; or the maintenance
      # branch, numbered against, with master as the public repository has it
      - env:
          BASE_REF: ${{ github.base_ref }}
          PUBLIC_REPOSITORY: ${{ vars.XCRAFT_PUBLIC_REPOSITORY || format('{0}/{1}', github.server_url, github.repository) }}
        run: |
          git update-ref "refs/remotes/origin/$BASE_REF" HEAD^1
          if [ "$BASE_REF" != master ]; then
            git fetch --no-tags "$PUBLIC_REPOSITORY" +master:refs/remotes/origin/master
            printf 'XCRAFT_MAINTENANCE=%s\n' "$BASE_REF" >> "$GITHUB_ENV"
          fi
      # the private bucket, read with credentials, which the embargo branches fetch their builds from
      - if: vars.XCRAFT_ROLE == 'private'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.PRIVATE_READ_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.PRIVATE_READ_AWS_SECRET_ACCESS_KEY }}
        run: printf 'AWS_ACCESS_KEY_ID=%s\nAWS_SECRET_ACCESS_KEY=%s\n' "$AWS_ACCESS_KEY_ID" "$AWS_SECRET_ACCESS_KEY" >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "0.10.x"
          activate-environment: true
      - run: uv sync --locked
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            .xcraft/cache/specs
            .xcraft/cache/resolved
            .xcraft/cache/base
          key: xcraft-metadata-${{ matrix.arch }}-${{ github.run_id }}
          restore-keys: xcraft-metadata-${{ matrix.arch }}-
      - run: |
          if ! command -v podman || ! command -v gpg; then
            sudo apt-get update -q
            sudo apt-get install -qy podman gnupg
          fi
      - name: Set up signing
        if: env.PUBLISH == 'true'
        env:
          PR_SIGNING_PRIVATE_KEY: ${{ secrets.PR_SIGNING_PRIVATE_KEY }}
        run: |
          export GNUPGHOME="$RUNNER_TEMP/xcraft-gnupg"
          printf 'GNUPGHOME=%s\n' "$GNUPGHOME" >> "$GITHUB_ENV"
          install -d -m 700 "$GNUPGHOME"
          printf '%s' "$PR_SIGNING_PRIVATE_KEY" | gpg --batch --import
          gpg --batch --list-secret-keys "$XCRAFT_KEY"
      # master's builds are fetched from the main bucket, the compiler caches too, never pushed
      - run: xcraft build --locked --fetch=needed
      # its development builds, signed by the PR key, for the publication: never pushed as builds
      - if: env.PUBLISH == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dev-builds-${{ matrix.arch }}
          path: .xcraft/cache/builds/${{ env.XCRAFT_KEY }}/${{ matrix.arch }}
          if-no-files-found: ignore
          overwrite: true
          retention-days: 1
      # its ISOs, made natively, as the programs of their packages run to make them, handed over too, never pushed:
      # aarch64's would run emulated on the host publishing
      - run: |
          xcraft iso --locked
          xcraft iso --locked --netinstall
      - if: env.PUBLISH == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: isos-${{ matrix.arch }}
          path: .xcraft/cache/isos/${{ matrix.arch }}
          overwrite: true
          retention-days: 1
      - name: Clean up signing
        if: always()
        run: |
          export GNUPGHOME="$RUNNER_TEMP/xcraft-gnupg"
          if [ -d "$GNUPGHOME" ]; then
            gpgconf --kill gpg-agent || true
            rm -rf "$GNUPGHOME"
          fi

  # the snapshot of all the architectures, from their development builds, and master's builds for the others, copied
  # from the main bucket; a publication replaces all the architectures of the stage
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      # the runs of the pull request, which number its builds
      actions: read
      # the comment telling where the stage is
      pull-requests: write
    concurrency:
      group: pull-request-${{ github.event.number }}-publish
      cancel-in-progress: true
    env:
      PUBLISH: ${{ vars.XCRAFT_ROLE == 'public' && github.event.pull_request.head.repo.full_name == github.repository }}
      XCRAFT_DEV: pr${{ github.event.number }}
      XCRAFT_KEY: ${{ github.event.pull_request.head.repo.full_name == github.repository && vars.PR_SIGNING_KEY_FINGERPRINT || '' }}
    steps:
      - *number
      - if: env.PUBLISH == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - if: env.PUBLISH == 'true'
        run: git update-ref refs/remotes/origin/master HEAD^1
      - if: env.PUBLISH == 'true'
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "0.10.x"
          activate-environment: true
      - if: env.PUBLISH == 'true'
        run: uv sync --locked
      # the metadata of each architecture
      - if: env.PUBLISH == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            .xcraft/cache/specs
            .xcraft/cache/resolved
            .xcraft/cache/base
          key: xcraft-metadata-x86_64_v2-${{ github.run_id }}
          restore-keys: xcraft-metadata-x86_64_v2-
      - if: env.PUBLISH == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            .xcraft/cache/specs
            .xcraft/cache/resolved
            .xcraft/cache/base
          key: xcraft-metadata-aarch64-${{ github.run_id }}
          restore-keys: xcraft-metadata-aarch64-
      # the development builds and the ISOs of the architectures, in the caches where publishing finds them
      - if: env.PUBLISH == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          path: ${{ runner.temp }}/handed
      - if: env.PUBLISH == 'true'
        run: |
          for dir in "$RUNNER_TEMP"/handed/*-*; do
            kind="${dir##*/}" && arch="${kind#*-}" && arch="${arch#builds-}"
            case "$kind" in
              dev-builds-*) cache=".xcraft/cache/builds/$XCRAFT_KEY" ;;
              isos-*) cache=".xcraft/cache/isos" ;;
              *) continue ;;
            esac
            mkdir -p "$cache"
            mv "$dir" "$cache/$arch"
          done
      - if: env.PUBLISH == 'true'
        run: |
          if ! command -v podman || ! command -v gpg; then
            sudo apt-get update -q
            sudo apt-get install -qy podman gnupg
          fi
      - name: Set up signing
        if: env.PUBLISH == 'true'
        env:
          PR_SIGNING_PRIVATE_KEY: ${{ secrets.PR_SIGNING_PRIVATE_KEY }}
        run: |
          export GNUPGHOME="$RUNNER_TEMP/xcraft-gnupg"
          printf 'GNUPGHOME=%s\n' "$GNUPGHOME" >> "$GITHUB_ENV"
          install -d -m 700 "$GNUPGHOME"
          printf '%s' "$PR_SIGNING_PRIVATE_KEY" | gpg --batch --import
          gpg --batch --list-secret-keys "$XCRAFT_KEY"
      - name: Publish the stage
        if: env.PUBLISH == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.DEV_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.DEV_AWS_SECRET_ACCESS_KEY }}
        run: |
          xcraft publish --locked --to dev --stage "$STAGE" --dev "$XCRAFT_DEV" --summary "$RUNNER_TEMP/stage.md"
      # what the pull request changes in the packages of the snapshot of each architecture, compared with master,
      # without building: for the comment, which goes without them if it fails
      - name: Compare the packages with master
        if: env.PUBLISH == 'true'
        continue-on-error: true
        run: |
          for arch in x86_64_v2 aarch64; do
            xcraft contents --arch "$arch" --diff HEAD^1 --markdown > "$RUNNER_TEMP/contents-$arch.md"
          done
      # where the snapshot of the stage is, how to use it, its development builds, and what changes in its packages, in
      # the summary of the run, and in a comment of the pull request, the same one updated by each run, the one of each
      # architecture of the earlier runs included
      - name: Tell where the stage is
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.number }}
        run: |
          marker="<!-- xcraft stage -->"
          body="$(
            printf '%s\n### Build %s succeeded\n\n' "$marker" "$XCRAFT_DEV_COUNTER"
            cat "$RUNNER_TEMP/stage.md"
            for arch in x86_64_v2 aarch64; do
              if [ -s "$RUNNER_TEMP/contents-$arch.md" ]; then
                printf '\n#### The packages of %s, compared with master\n\n' "$arch"
                cat "$RUNNER_TEMP/contents-$arch.md"
              fi
            done
          )"
          printf '%s\n' "$body" >> "$GITHUB_STEP_SUMMARY"
          comments="repos/$GITHUB_REPOSITORY/issues/$NUMBER/comments"
          id=$(gh api --paginate "$comments" --jq '.[] | select(.body | startswith("<!-- xcraft stage")) | .id' | head -n 1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" > /dev/null
          else
            gh api -X POST "$comments" -f body="$body" > /dev/null
          fi
      - name: Clean up signing
        if: always()
        run: |
          export GNUPGHOME="$RUNNER_TEMP/xcraft-gnupg"
          if [ -d "$GNUPGHOME" ]; then
            gpgconf --kill gpg-agent || true
            rm -rf "$GNUPGHOME"
          fi
