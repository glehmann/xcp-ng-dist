name: Lock update

# the updates of the upstream packages, proposed as a pull request with their impacts: the versions of all the
# architectures are looked for natively, on one machine
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: lock-update

env:
  FORCE_COLOR: "1"
  BRANCH: lock-update

jobs:
  update:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "0.10.x"
          activate-environment: true
      - run: uv sync --locked
      # in the build environment, which podman runs
      - run: command -v podman || { sudo apt-get update -q && sudo apt-get install -qy podman; }
      - run: xcraft lock --update
      - id: changed
        run: git diff --quiet || echo "changed=true" >> "$GITHUB_OUTPUT"
      - if: steps.changed.outputs.changed
        run: |
          {
            echo 'The updates of the upstream packages, by `xcraft lock --update`.'
            echo
            echo 'Their impacts, by `xcraft impacts`: `xcraft bump` the packages to rebuild, `xcraft ack` the others.'
            echo
            xcraft impacts --markdown
          } > "$RUNNER_TEMP/body.md"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qa -s -m "Update the lock of the upstream packages"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$BRANCH"
          if gh pr view "$BRANCH" --json state --jq .state | grep -q OPEN; then
            gh pr edit "$BRANCH" --body-file "$RUNNER_TEMP/body.md"
          else
            gh pr create --head "$BRANCH" --title "Update the lock of the upstream packages" --body-file "$RUNNER_TEMP/body.md"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
