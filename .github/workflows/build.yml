name: Build

# the builds of all the packages of master, natively on each architecture, pushed to the remote storage with their
# sources and compiler caches, for the other builders and the developers to fetch rather than build them again, then
# published in the incoming stage, all the architectures in one snapshot; the other branches are built by their pull
# requests only, of forks too, see pull-request.yml. The maintenance branches too, numbered against themselves, their
# builds pushed for the promotion of their commits to the stages, see promote.yml, but not published. The repository
# variable XCRAFT_ROLE tells which branches a repository builds: public, the public one, master and the maintenance
# branches; private, the private one of the embargoes, its embargo branches only, to its private bucket, never master,
# which it has for the developers only, see master-sync.yml; without it, nothing
on:
  push:
    branches: [master, "maint/**", "embargo/**"]

permissions: {}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64_v2
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    name: build (${{ matrix.arch }})
    if: >-
      (vars.XCRAFT_ROLE == 'public' && !startsWith(github.ref_name, 'embargo/'))
      || (vars.XCRAFT_ROLE == 'private' && startsWith(github.ref_name, 'embargo/'))
    runs-on: ${{ matrix.runner }}
    # the CI key and the credentials of the bucket, in its environment, which only the branches built deploy to: a
    # branch changing this workflow cannot get them; main, of master and the maintenance branches, or private, of the
    # embargo branches, with the CI key too, the builds copied as they are once the embargo ends
    environment: ${{ startsWith(github.ref_name, 'embargo/') && 'private' || 'main' }}
    # one push at a time on each architecture: the latest one has the latest builds
    concurrency:
      group: build-${{ github.ref }}-${{ matrix.arch }}
    env:
      FORCE_COLOR: "1"
      XCRAFT_ARCH: ${{ matrix.arch }}
      SIGNING_KEY_FINGERPRINT: ${{ vars.SIGNING_KEY_FINGERPRINT }}
      # the key signing the builds
      XCRAFT_KEY: ${{ vars.SIGNING_KEY_FINGERPRINT }}
      TO: ${{ startsWith(github.ref_name, 'embargo/') && 'private' || 'main' }}
      PUBLIC_REPOSITORY: ${{ vars.XCRAFT_PUBLIC_REPOSITORY || format('{0}/{1}', github.server_url, github.repository) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          # the previous commit, which the build IDs of the main branch are checked against; all of them for a
          # maintenance branch, whose commits are told from master's by their first-parent chains
          fetch-depth: ${{ github.ref_name == 'master' && 2 || 0 }}
      - name: Number against the maintenance branch
        if: github.ref_name != 'master'
        run: |
          # master as the public repository has it, current, whatever the private one has
          git fetch --no-tags "$PUBLIC_REPOSITORY" +master:refs/remotes/origin/master
          printf 'XCRAFT_MAINTENANCE=%s\n' "$GITHUB_REF_NAME" >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "0.10.x"
          activate-environment: true
      - run: uv sync --locked
      # the metadata xcraft computed in the previous runs, named after what they are computed from: the parsed specs,
      # the resolutions, the packages of the base image; without changes, neither dnf nor the build environment image
      # is needed to know what to build
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            .xcraft/cache/specs
            .xcraft/cache/resolved
            .xcraft/cache/base
          key: xcraft-metadata-${{ matrix.arch }}-${{ github.run_id }}
          restore-keys: xcraft-metadata-${{ matrix.arch }}-
      # podman runs the builds; gpg verifies the remote builds and compiler caches
      - run: |
          if ! command -v podman || ! command -v gpg; then
            sudo apt-get update -q
            sudo apt-get install -qy podman gnupg
          fi
      - name: Set up signing
        env:
          SIGNING_PRIVATE_KEY: ${{ secrets.SIGNING_PRIVATE_KEY }}
        run: |
          export GNUPGHOME="$RUNNER_TEMP/xcraft-gnupg"
          printf 'GNUPGHOME=%s\n' "$GNUPGHOME" >> "$GITHUB_ENV"
          install -d -m 700 "$GNUPGHOME"
          printf '%s' "$SIGNING_PRIVATE_KEY" | gpg --batch --import
          gpg --batch --list-secret-keys "$SIGNING_KEY_FINGERPRINT"
      # the pinned upstream packages the copy of the storage misses, from their repositories, before the build needs
      # them: the repositories drop the old versions; those already gone are reported, for a developer to push them
      # from the store of their machine with xcraft push upstream
      - env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: xcraft push upstream --to "$TO"
        continue-on-error: true
      # signed once made, by the CI key
      # what the remote storage has is not built again, nor fetched, but for the builds of the others
      - run: xcraft build --locked --fetch=needed
      # what was built, even when the build failed: xcraft push fails then too, after pushing the others
      - if: ${{ !cancelled() }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: xcraft push --to "$TO" --key "$SIGNING_KEY_FINGERPRINT"
      # the compiler caches the builds filled, even of those which failed
      - if: ${{ !cancelled() }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: xcraft push ccache --to "$TO" --key "$SIGNING_KEY_FINGERPRINT"
      # the ISOs, made natively, as the programs of their packages run to make them, and pushed, for the publication to
      # take them rather than make them: aarch64's would run emulated on its host
      - run: |
          xcraft iso --final --locked
          xcraft iso --final --locked --netinstall
      - env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: xcraft push isos --to "$TO" --key "$SIGNING_KEY_FINGERPRINT"
      - name: Clean up signing
        if: always()
        run: |
          export GNUPGHOME="$RUNNER_TEMP/xcraft-gnupg"
          if [ -d "$GNUPGHOME" ]; then
            gpgconf --kill gpg-agent || true
            rm -rf "$GNUPGHOME"
          fi

  # the snapshot of all the architectures, once each pushed its builds and its ISOs: published from one of them, which
  # fetches nothing but the ISOs, the storage copying the builds; a publication replaces all the architectures of the
  # stage
  publish:
    needs: build
    # master's only: the commits of the maintenance branches are published by their promotion, see promote.yml
    if: github.ref_name == 'master'
    runs-on: ubuntu-latest
    environment: main
    # in the order of the pushes, the latest one last
    concurrency:
      group: publish-${{ github.ref }}
    env:
      FORCE_COLOR: "1"
      SIGNING_KEY_FINGERPRINT: ${{ vars.SIGNING_KEY_FINGERPRINT }}
      XCRAFT_KEY: ${{ vars.SIGNING_KEY_FINGERPRINT }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "0.10.x"
          activate-environment: true
      - run: uv sync --locked
      # the metadata of each architecture, as its build left it
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            .xcraft/cache/specs
            .xcraft/cache/resolved
            .xcraft/cache/base
          key: xcraft-metadata-x86_64_v2-${{ github.run_id }}
          restore-keys: xcraft-metadata-x86_64_v2-
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            .xcraft/cache/specs
            .xcraft/cache/resolved
            .xcraft/cache/base
          key: xcraft-metadata-aarch64-${{ github.run_id }}
          restore-keys: xcraft-metadata-aarch64-
      - run: |
          if ! command -v podman || ! command -v gpg; then
            sudo apt-get update -q
            sudo apt-get install -qy podman gnupg
          fi
      - name: Set up signing
        env:
          SIGNING_PRIVATE_KEY: ${{ secrets.SIGNING_PRIVATE_KEY }}
        run: |
          export GNUPGHOME="$RUNNER_TEMP/xcraft-gnupg"
          printf 'GNUPGHOME=%s\n' "$GNUPGHOME" >> "$GITHUB_ENV"
          install -d -m 700 "$GNUPGHOME"
          printf '%s' "$SIGNING_PRIVATE_KEY" | gpg --batch --import
          gpg --batch --list-secret-keys "$SIGNING_KEY_FINGERPRINT"
      - name: Publish incoming
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: xcraft publish --locked --to main --stage incoming --key "$SIGNING_KEY_FINGERPRINT"
      - name: Clean up signing
        if: always()
        run: |
          export GNUPGHOME="$RUNNER_TEMP/xcraft-gnupg"
          if [ -d "$GNUPGHOME" ]; then
            gpgconf --kill gpg-agent || true
            rm -rf "$GNUPGHOME"
          fi
