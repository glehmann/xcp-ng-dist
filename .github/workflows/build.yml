name: Build

# the builds of all the packages of master, natively on each architecture, pushed to the remote storage with their
# sources and compiler caches, for the other builders and the developers to fetch rather than build them again, then
# published in the incoming stage, all the architectures in one snapshot; the other branches are built by their pull
# requests only, of forks too, see pull-request.yml
on:
  push:
    branches: [master]

permissions: {}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64_v2
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    name: build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    # the CI key and the credentials of the main bucket, in the main environment, which only master deploys to: a branch
    # changing this workflow cannot get them
    environment: main
    # one push at a time on each architecture: the latest one has the latest builds
    concurrency:
      group: build-${{ github.ref }}-${{ matrix.arch }}
    env:
      FORCE_COLOR: "1"
      XCRAFT_ARCH: ${{ matrix.arch }}
      SIGNING_KEY_FINGERPRINT: ${{ vars.SIGNING_KEY_FINGERPRINT }}
      # the key signing the builds
      XCRAFT_KEY: ${{ vars.SIGNING_KEY_FINGERPRINT }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          # the previous commit, which the build IDs of the main branch are checked against
          fetch-depth: 2
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "0.10.x"
          activate-environment: true
      - run: uv sync --locked
      # the metadata xcraft computed in the previous runs, named after what they are computed from: the parsed specs,
      # the resolutions, the packages of the base image; without changes, neither dnf nor the build environment image
      # is needed to know what to build
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            .xcraft/cache/specs
            .xcraft/cache/resolved
            .xcraft/cache/base
          key: xcraft-metadata-${{ matrix.arch }}-${{ github.run_id }}
          restore-keys: xcraft-metadata-${{ matrix.arch }}-
      # podman runs the builds; gpg verifies the remote builds and compiler caches
      - run: |
          if ! command -v podman || ! command -v gpg; then
            sudo apt-get update -q
            sudo apt-get install -qy podman gnupg
          fi
      - name: Set up signing
        env:
          SIGNING_PRIVATE_KEY: ${{ secrets.SIGNING_PRIVATE_KEY }}
        run: |
          export GNUPGHOME="$RUNNER_TEMP/xcraft-gnupg"
          printf 'GNUPGHOME=%s\n' "$GNUPGHOME" >> "$GITHUB_ENV"
          install -d -m 700 "$GNUPGHOME"
          printf '%s' "$SIGNING_PRIVATE_KEY" | gpg --batch --import
          gpg --batch --list-secret-keys "$SIGNING_KEY_FINGERPRINT"
      # the pinned upstream packages the copy of the storage misses, from their repositories, before the build needs
      # them: the repositories drop the old versions; those already gone are reported, for a developer to push them
      # from the store of their machine with xcraft push upstream
      - env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: xcraft push upstream --to main
        continue-on-error: true
      # signed once made, by the CI key
      # what the remote storage has is not built again, nor fetched, but for the builds of the others
      - run: xcraft build --locked --fetch=needed
      # what was built, even when the build failed: xcraft push fails then too, after pushing the others
      - if: ${{ !cancelled() }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: xcraft push --to main --key "$SIGNING_KEY_FINGERPRINT"
      # the compiler caches the builds filled, even of those which failed
      - if: ${{ !cancelled() }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: xcraft push ccache --to main --key "$SIGNING_KEY_FINGERPRINT"
      - name: Clean up signing
        if: always()
        run: |
          export GNUPGHOME="$RUNNER_TEMP/xcraft-gnupg"
          if [ -d "$GNUPGHOME" ]; then
            gpgconf --kill gpg-agent || true
            rm -rf "$GNUPGHOME"
          fi

  # the snapshot of all the architectures, once each pushed its builds: published from one of them, which fetches
  # nothing, the storage copying them; a publication replaces all the architectures of the stage
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: main
    # in the order of the pushes, the latest one last
    concurrency:
      group: publish-${{ github.ref }}
    env:
      FORCE_COLOR: "1"
      SIGNING_KEY_FINGERPRINT: ${{ vars.SIGNING_KEY_FINGERPRINT }}
      XCRAFT_KEY: ${{ vars.SIGNING_KEY_FINGERPRINT }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "0.10.x"
          activate-environment: true
      - run: uv sync --locked
      # the metadata of each architecture, as its build left it
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            .xcraft/cache/specs
            .xcraft/cache/resolved
            .xcraft/cache/base
          key: xcraft-metadata-x86_64_v2-${{ github.run_id }}
          restore-keys: xcraft-metadata-x86_64_v2-
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            .xcraft/cache/specs
            .xcraft/cache/resolved
            .xcraft/cache/base
          key: xcraft-metadata-aarch64-${{ github.run_id }}
          restore-keys: xcraft-metadata-aarch64-
      - run: |
          if ! command -v podman || ! command -v gpg; then
            sudo apt-get update -q
            sudo apt-get install -qy podman gnupg
          fi
      - name: Set up signing
        env:
          SIGNING_PRIVATE_KEY: ${{ secrets.SIGNING_PRIVATE_KEY }}
        run: |
          export GNUPGHOME="$RUNNER_TEMP/xcraft-gnupg"
          printf 'GNUPGHOME=%s\n' "$GNUPGHOME" >> "$GITHUB_ENV"
          install -d -m 700 "$GNUPGHOME"
          printf '%s' "$SIGNING_PRIVATE_KEY" | gpg --batch --import
          gpg --batch --list-secret-keys "$SIGNING_KEY_FINGERPRINT"
      - name: Publish incoming
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: xcraft publish --locked --to main --stage incoming --key "$SIGNING_KEY_FINGERPRINT"
      - name: Clean up signing
        if: always()
        run: |
          export GNUPGHOME="$RUNNER_TEMP/xcraft-gnupg"
          if [ -d "$GNUPGHOME" ]; then
            gpgconf --kill gpg-agent || true
            rm -rf "$GNUPGHOME"
          fi
