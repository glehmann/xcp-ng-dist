name: Checks

# on the pushes of the repository; those of the forks' pull requests are checked by their builds, see pull-request.yml
on: push

permissions: {}

jobs:
  lock:
    runs-on: ubuntu-latest
    env:
      FORCE_COLOR: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "0.10.x"
          activate-environment: true
      - run: uv sync --locked
      # podman parses the specs; gpg verifies the remote builds in the plan
      - run: |
          if ! command -v podman || ! command -v gpg; then
            sudo apt-get update -q
            sudo apt-get install -qy podman gnupg
          fi
      # the lock has what the builds of all the architectures need: their build roots, resolved here, natively
      - run: for arch in x86_64_v2 aarch64; do xcraft build --dry-run --locked --arch "$arch"; done
